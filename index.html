    <script type="application/ld+json">

        "address": {
          "@type": "PostalAddress",
          "streetAddress": "41ft Road Kamal Vihar, Sant Nagar, Burari",
          "addressLocality": "Delhi",
          "postalCode": "110084",
          "addressCountry": "IN"
